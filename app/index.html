<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greater Boston Events</title>
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --fg: #1c1c1a; --muted: #6a6a64; --line: #e3e1da; --hover: #f1efe8;
    --accent: #0b5cad; --accent-fg: #ffffff; --chip: #ecebe5;
    --c-music: #7b3fb5; --c-arts: #b2361f; --c-food: #b86a00; --c-fest: #c0287a;
    --c-family: #1f8a5b; --c-tech: #2463b8; --c-sports: #3f7d1e; --c-community: #6b5a3e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --fg: #ecebe6; --muted: #9b9a93; --line: #2e2e2b; --hover: #252523;
      --accent: #6aa9ec; --accent-fg: #0d1b2a; --chip: #262624;
      --c-music: #b98ae6; --c-arts: #ee8a74; --c-food: #e8a94a; --c-fest: #ec7bb8;
      --c-family: #5fcf9a; --c-tech: #7eaef0; --c-sports: #93cc6a; --c-community: #c7b28e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 80px; }
  header h1 { font-size: 1.5rem; margin: 0; letter-spacing: -.01em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
  button { font: inherit; color: inherit; }

  /* Sticky controls: day strip + filter chips */
  .controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 8px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
  .day { flex: 0 0 auto; min-width: 54px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 5px 6px 4px; text-align: center; cursor: pointer; line-height: 1.15; }
  .day small { display: block; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .day strong { display: block; font-size: 1.05rem; }
  .day span { display: block; font-size: .7rem; color: var(--muted); }
  .day.weekend small { color: var(--accent); }
  .day[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .day[aria-pressed=true] small, .day[aria-pressed=true] span { color: var(--accent-fg); }
  .day:disabled { opacity: .4; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  input[type=search] { font: inherit; font-size: .88rem; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; flex: 1 1 180px; min-width: 0; }
  .chip { font-size: .8rem; border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed=true] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .chip.cat::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 5px; vertical-align: 1px; }
  .chip.cat[aria-pressed=true] { background: var(--c); border-color: var(--c); color: #fff; }
  .chip.cat[aria-pressed=true]::before { background: #fff; }
  .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
  .count { color: var(--muted); font-size: .8rem; margin-left: auto; }
  .clear { font-size: .8rem; color: var(--accent); background: none; border: 0; cursor: pointer; padding: 0; }

  /* City multi-select */
  .cities { position: relative; }
  .cities summary { list-style: none; }
  .cities summary::-webkit-details-marker { display: none; }
  .cities summary::after { content: " ▾"; font-size: .7rem; }
  .cities[open] summary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .cities .menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / .15); min-width: 200px; }
  .cities label { display: flex; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 6px; font-size: .88rem; cursor: pointer; }
  .cities label:hover { background: var(--hover); }
  .cities label span { margin-left: auto; color: var(--muted); font-size: .78rem; }

  /* Agenda */
  h2 { font-size: .95rem; margin: 22px 0 4px; padding-bottom: 4px; border-bottom: 2px solid var(--fg); display: flex; justify-content: space-between; align-items: baseline; scroll-margin-top: 150px; }
  h2 small { color: var(--muted); font-weight: 400; font-size: .8rem; }
  .ongoing h2 { border-bottom-color: var(--line); }
  .ev { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 0 12px; padding: 8px 6px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 6px; }
  .ev:hover { background: var(--hover); }
  .time { font-variant-numeric: tabular-nums; font-size: .85rem; font-weight: 600; padding-top: 1px; }
  .time.tba { color: var(--muted); font-weight: 400; font-size: .78rem; }
  .title { font-weight: 600; line-height: 1.3; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .sub { color: var(--muted); font-size: .82rem; margin-top: 1px; display: flex; flex-wrap: wrap; gap: 0 8px; align-items: center; }
  .tag { color: var(--c); font-weight: 600; }
  .free { font-size: .72rem; font-weight: 700; color: var(--c-family); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
  .more { grid-column: 2; display: none; }
  .ev.open { background: var(--panel); box-shadow: 0 1px 0 var(--line), 0 0 0 1px var(--line); }
  .ev.open .more { display: block; }
  .more p { margin: 6px 0 0; font-size: .88rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; align-items: center; }
  .btn { font-size: .8rem; text-decoration: none; border-radius: 7px; padding: 4px 10px; border: 1px solid var(--line); color: var(--fg); background: var(--panel); cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .cal { position: relative; }
  .cal summary { list-style: none; }
  .cal summary::-webkit-details-marker { display: none; }
  .cal .menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 3; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; min-width: 190px; box-shadow: 0 8px 24px rgb(0 0 0 / .15); }
  .cal .menu a, .cal .menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 6px 10px; border-radius: 6px; font-size: .85rem; color: var(--fg); text-decoration: none; cursor: pointer; }
  .cal .menu a:hover, .cal .menu button:hover { background: var(--hover); }
  .via { color: var(--muted); font-size: .75rem; }
  .dates { font-size: .78rem; color: var(--muted); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
  @media (max-width: 520px) { #cats { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } #cats .count { display: none; } .ev { grid-template-columns: 52px minmax(0, 1fr); gap: 0 8px; } h2 { scroll-margin-top: 190px; } }
</style>
<script src="data/events.js"></script>
</head>
<body>
<main>
  <header>
    <h1>Greater Boston Events</h1>
    <p id="sub"></p>
  </header>
  <div class="controls">
    <div class="days" id="days"></div>
    <div class="row">
      <input type="search" id="q" placeholder="Search events, venues…">
      <button class="chip" data-quick="tonight">Tonight</button>
      <button class="chip" data-quick="weekend">This weekend</button>
      <button class="chip" data-quick="free">Free</button>
      <details class="cities" id="cities"><summary class="chip" id="citiesLabel">All cities</summary><div class="menu" id="cityMenu"></div></details>
    </div>
    <div class="row" id="cats"></div>
  </div>
  <div id="list"></div>
</main>
<script>
(() => {
  const data = window.EVENTS_DATA;
  const $ = (id) => document.getElementById(id);
  if (!data) {
    $('list').innerHTML = '<p class="empty">No data yet. Run the hank to generate <code>app/data/events.js</code>. See README.md.</p>';
    return;
  }

  const TZ = 'America/New_York';
  const today = new Date().toLocaleDateString('en-CA', { timeZone: TZ });
  const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  const dow = (iso) => new Date(iso + 'T12:00:00').getDay();
  const esc = (s = '') => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fmtDay = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const fmtShort = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const fmtTime = (t) => { const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}${m ? ':' + String(m).padStart(2, '0') : ''}${h < 12 ? 'am' : 'pm'}`; };
  const isFree = (e) => /^free\b/i.test(e.price || '');
  const CAT_VAR = { music: 'music', 'arts & theater': 'arts', 'food & drink': 'food', 'festivals & markets': 'fest', family: 'family', 'tech & talks': 'tech', 'sports & outdoors': 'sports', community: 'community' };
  const catColor = (c) => `var(--c-${CAT_VAR[c] || 'community'})`;

  const events = data.events.filter((e) => (e.endDate || e.date) >= today).sort((a, b) => (a.date + (a.startTime || '99')).localeCompare(b.date + (b.startTime || '99')));
  events.forEach((e, i) => (e._i = i));

  // Repeats: the same title at the same place on 3+ dates is shown once, under "Ongoing & recurring".
  const seriesKey = (e) => [e.title.toLowerCase().replace(/\s+/g, ' ').trim(), e.city, (e.venue || '').toLowerCase()].join('|');
  const groups = new Map();
  for (const e of events) groups.set(seriesKey(e), [...(groups.get(seriesKey(e)) || []), e]);
  const isSeries = (e) => groups.get(seriesKey(e)).length >= 3;
  // A run (exhibition, festival) has an endDate: it is on every day from date through endDate.
  const isRun = (e) => e.endDate && e.endDate > e.date;
  const onDay = (e, d) => (isRun(e) ? e.date <= d && d <= e.endDate : e.date === d);
  const overlaps = (e, from, to) => e.date <= to && (e.endDate || e.date) >= from;

  $('sub').textContent = `${events.length} upcoming events · ${fmtShort(data.window.start)}–${fmtShort(data.window.end)} · updated ${new Date(data.generatedAt).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })}`;

  // State
  const state = { q: '', day: '', quick: '', free: false, cats: new Set(), cities: new Set() };

  // Filters that apply before the day choice (so the day strip can show counts).
  const baseMatch = (e) =>
    (!state.cities.size || state.cities.has(e.city)) &&
    (!state.cats.size || state.cats.has(e.category)) &&
    (!state.free || isFree(e)) &&
    (!state.q || [e.title, e.venue, e.description, e.source, e.city].join(' ').toLowerCase().includes(state.q));
  function weekend() {
    const d = dow(today);
    const sunday = addDays(today, d === 0 ? 0 : 7 - d);
    return { start: d === 0 || d === 6 ? today : addDays(sunday, -2), end: sunday };
  }
  const dayMatch = (e) => {
    if (state.day) return onDay(e, state.day);
    if (state.quick === 'tonight') return onDay(e, today) && (e.startTime || '') >= '17:00';
    if (state.quick === 'weekend') { const w = weekend(); return overlaps(e, w.start, w.end); }
    return true;
  };

  // Day strip
  const days = [];
  for (let d = data.window.start < today ? today : data.window.start; d <= data.window.end; d = addDays(d, 1)) days.push(d);
  // Category chips
  const cats = data.window.categories.filter((c) => events.some((e) => e.category === c));
  $('cats').innerHTML = cats.map((c) => `<button class="chip cat" style="--c:${catColor(c)}" data-cat="${esc(c)}">${esc(c)}</button>`).join('') +
    '<button class="clear" id="clear" hidden>Clear filters</button><span class="count" id="count"></span>';
  // City menu
  const cityCounts = Object.fromEntries(data.window.cities.map((c) => [c, events.filter((e) => e.city === c).length]));
  $('cityMenu').innerHTML = data.window.cities.filter((c) => cityCounts[c])
    .map((c) => `<label><input type="checkbox" value="${esc(c)}">${esc(c)}<span>${cityCounts[c]}</span></label>`).join('');

  // Events
  $('q').addEventListener('input', (ev) => { state.q = ev.target.value.toLowerCase(); render(); });
  $('days').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-day]');
    if (!b) return;
    state.day = state.day === b.dataset.day ? '' : b.dataset.day;
    if (state.day) state.quick = '';
    render();
    window.scrollTo({ top: 0 });
  });
  document.querySelectorAll('[data-quick]').forEach((b) => b.addEventListener('click', () => {
    const q = b.dataset.quick;
    if (q === 'free') state.free = !state.free;
    else { state.quick = state.quick === q ? '' : q; if (state.quick) state.day = ''; }
    render();
  }));
  $('cats').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-cat]');
    if (b) { state.cats.has(b.dataset.cat) ? state.cats.delete(b.dataset.cat) : state.cats.add(b.dataset.cat); render(); }
    if (ev.target.id === 'clear') {
      Object.assign(state, { q: '', day: '', quick: '', free: false });
      state.cats.clear(); state.cities.clear();
      $('q').value = '';
      $('cityMenu').querySelectorAll('input').forEach((i) => (i.checked = false));
      render();
    }
  });
  $('cityMenu').addEventListener('change', (ev) => { ev.target.checked ? state.cities.add(ev.target.value) : state.cities.delete(ev.target.value); render(); });
  document.addEventListener('click', (ev) => {
    for (const d of document.querySelectorAll('details[open]')) if (!d.contains(ev.target)) d.open = false;
  });
  $('list').addEventListener('click', (ev) => {
    const ics = ev.target.closest('[data-ics]');
    if (ics) { downloadIcs(events[+ics.dataset.ics]); ics.closest('details').open = false; return; }
    if (ev.target.closest('a, button, details')) return;
    const row = ev.target.closest('.ev');
    if (row) row.classList.toggle('open');
  });

  // Calendar links
  const compact = (date, time) => date.replace(/-/g, '') + (time ? 'T' + time.replace(':', '') + '00' : '');
  function endOf(e) {
    if (e.endTime) return e.endTime;
    const [h, m] = e.startTime.split(':').map(Number);
    const mins = h * 60 + m + 120;
    return mins >= 24 * 60 ? '23:59' : `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
  }
  const location = (e) => [e.venue, e.address, e.city + ', MA'].filter(Boolean).join(', ');
  function googleUrl(e) {
    const dates = e.startTime ? `${compact(e.date, e.startTime)}/${compact(e.date, endOf(e))}` : `${compact(e.date)}/${compact(addDays(e.date, 1))}`;
    const p = new URLSearchParams({ action: 'TEMPLATE', text: e.title, dates, ctz: TZ, location: location(e), details: [e.description, e.registerUrl || e.url].filter(Boolean).join('\n\n') });
    return 'https://calendar.google.com/calendar/render?' + p;
  }
  const icsText = (s) => String(s).replace(/\\/g, '\\\\').replace(/[,;]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
  function downloadIcs(e) {
    const when = e.startTime
      ? [`DTSTART;TZID=${TZ}:${compact(e.date, e.startTime)}`, `DTEND;TZID=${TZ}:${compact(e.date, endOf(e))}`]
      : [`DTSTART;VALUE=DATE:${compact(e.date)}`, `DTEND;VALUE=DATE:${compact(addDays(e.date, 1))}`];
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//boston-events//EN', 'BEGIN:VEVENT',
      `UID:${e.id || compact(e.date) + Math.random().toString(36).slice(2)}@boston-events`,
      `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '')}`, ...when,
      `SUMMARY:${icsText(e.title)}`, `LOCATION:${icsText(location(e))}`, `URL:${e.registerUrl || e.url}`,
      `DESCRIPTION:${icsText([e.description, e.url].filter(Boolean).join('\n\n'))}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })), download: e.title.replace(/[^\w]+/g, '-').slice(0, 60) + '.ics' });
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // Rendering
  function row(e, series) {
    const time = isRun(e) ? '<div class="time tba">On view</div>' : e.startTime ? `<div class="time">${esc(fmtTime(e.startTime))}</div>` : '<div class="time tba">All day</div>';
    const sub = [
      `<span>${e.venue && e.venue !== e.city ? esc(e.venue) + ', ' : ''}${esc(e.city)}</span>`,
      `<span class="tag" style="--c:${catColor(e.category)}">${esc(e.category)}</span>`,
      isFree(e) ? '<span class="free">FREE</span>' : e.price ? `<span>${esc(e.price)}</span>` : '',
    ].join('');
    const when = series ? `<div class="dates">${esc(seriesDates(series))}${e.startTime ? ' · ' + esc(fmtTime(e.startTime)) : ''}</div>`
      : isRun(e) ? `<div class="dates">${e.date > today ? `${esc(fmtShort(e.date))}–${esc(fmtShort(e.endDate))}` : `Through ${esc(fmtShort(e.endDate))}`}${e.startTime ? ' · from ' + esc(fmtTime(e.startTime)) : ''}</div>` : '';
    const endTime = !series && e.startTime && e.endTime ? `<div class="dates">${esc(fmtTime(e.startTime))}–${esc(fmtTime(e.endTime))}</div>` : '';
    return `<article class="ev">
      ${series ? `<div class="time tba">${series.length}×</div>` : time}
      <div>
        <div class="title"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></div>
        <div class="sub">${sub}</div>${when}
      </div>
      <div class="more">
        ${endTime}
        ${e.description ? `<p>${esc(e.description)}</p>` : ''}
        <div class="actions">
          ${e.registerUrl ? `<a class="btn primary" href="${esc(e.registerUrl)}" target="_blank" rel="noopener">Tickets / register</a>` : ''}
          <a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener">Event page</a>
          <details class="cal"><summary class="btn">Add to calendar ▾</summary><div class="menu">
            <a href="${esc(googleUrl(e))}" target="_blank" rel="noopener">Google Calendar</a>
            <button data-ics="${e._i}">Apple / Outlook (.ics)</button>
          </div></details>
          <span class="via">via ${esc(e.source)}</span>
        </div>
      </div>
    </article>`;
  }
  function seriesDates(list) {
    const ds = [...new Set(list.map((e) => e.date))].sort();
    const consecutive = ds.every((d, i) => i === 0 || d === addDays(ds[i - 1], 1));
    if (consecutive) return `Daily, ${fmtShort(ds[0])}–${fmtShort(ds.at(-1))}`;
    const weekdays = [];
    for (let d = ds[0]; d <= ds.at(-1); d = addDays(d, 1)) if (dow(d) % 6) weekdays.push(d);
    if (weekdays.join() === ds.join()) return `Weekdays, ${fmtShort(ds[0])}–${fmtShort(ds.at(-1))}`;
    return ds.length <= 4 ? ds.map(fmtShort).join(', ') : `${ds.length} dates, ${fmtShort(ds[0])}–${fmtShort(ds.at(-1))}`;
  }

  function render() {
    const base = events.filter(baseMatch);
    // Day strip with counts under the current non-day filters.
    const perDay = {};
    for (const e of base) if (!isRun(e)) perDay[e.date] = (perDay[e.date] || 0) + 1;
    $('days').innerHTML = days.map((d) => {
      const n = perDay[d] || 0;
      const label = d === today ? 'Today' : new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' });
      return `<button class="day${dow(d) === 0 || dow(d) === 6 ? ' weekend' : ''}" data-day="${d}" aria-pressed="${state.day === d}" ${n ? '' : 'disabled'}>
        <small>${label}</small><strong>${Number(d.slice(8))}</strong><span>${n}</span></button>`;
    }).join('');
    document.querySelectorAll('[data-quick]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.quick === 'free' ? state.free : state.quick === b.dataset.quick));
    document.querySelectorAll('[data-cat]').forEach((b) => b.setAttribute('aria-pressed', state.cats.has(b.dataset.cat)));
    $('citiesLabel').textContent = !state.cities.size ? 'All cities' : state.cities.size <= 2 ? [...state.cities].join(', ') : `${state.cities.size} cities`;
    $('citiesLabel').setAttribute('aria-pressed', state.cities.size > 0);
    $('clear').hidden = !(state.q || state.day || state.quick || state.free || state.cats.size || state.cities.size);

    const shown = base.filter(dayMatch);
    const single = shown.filter((e) => !isSeries(e) && !isRun(e));
    // One row per series that has any date in view.
    const seriesShown = new Map();
    for (const e of shown.filter((e) => isSeries(e) && !isRun(e))) if (!seriesShown.has(seriesKey(e))) seriesShown.set(seriesKey(e), e);
    const runs = shown.filter(isRun).sort((a, b) => a.endDate.localeCompare(b.endDate));
    $('count').textContent = `${single.length + seriesShown.size + runs.length} shown`;
    if (!single.length && !seriesShown.size && !runs.length) { $('list').innerHTML = '<p class="empty">No events match these filters.</p>'; return; }

    let html = '';
    let day = '';
    single.forEach((e) => {
      if (e.date !== day) {
        day = e.date;
        const n = single.filter((x) => x.date === day).length;
        html += `<h2 id="d-${day}">${esc(day === today ? 'Today · ' + fmtDay(day) : fmtDay(day))}<small>${n} event${n === 1 ? '' : 's'}</small></h2>`;
      }
      html += row(e);
    });
    if (seriesShown.size || runs.length) {
      html += `<section class="ongoing"><h2>On view &amp; recurring<small>${seriesShown.size + runs.length}</small></h2>` +
        runs.map((e) => row(e)).join('') +
        [...seriesShown].map(([k, e]) => row(e, groups.get(k))).join('') + '</section>';
    }
    $('list').innerHTML = html;
  }
  render();
})();
</script>
</body>
</html>
