<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greater Boston Events</title>
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --fg: #1c1c1a; --muted: #6a6a64; --line: #e3e1da;
    --accent: #0b5cad; --accent-fg: #ffffff; --chip: #ecebe5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --panel: #1d1d1b; --fg: #ecebe6; --muted: #9b9a93; --line: #2e2e2b; --accent: #6aa9ec; --accent-fg: #0d1b2a; --chip: #262624; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 80px; }
  header h1 { font-size: 1.6rem; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
  .controls { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 12px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 8px; display: grid; gap: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  input[type=search], select { font: inherit; font-size: .9rem; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  input[type=search] { flex: 1 1 200px; }
  .chip { font: inherit; font-size: .82rem; border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
  .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .count { color: var(--muted); font-size: .85rem; margin-left: auto; }
  h2 { font-size: 1rem; margin: 26px 0 6px; color: var(--muted); font-weight: 600; letter-spacing: .01em; }
  .event { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 8px 0; }
  .event h3 { margin: 0; font-size: 1.02rem; line-height: 1.35; }
  .meta { color: var(--muted); font-size: .87rem; margin-top: 2px; }
  .meta b { color: var(--fg); font-weight: 600; }
  .event p { margin: 6px 0 0; font-size: .92rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .actions a, .actions button { font: inherit; font-size: .83rem; text-decoration: none; border-radius: 7px; padding: 4px 10px; border: 1px solid var(--line); color: var(--fg); background: none; cursor: pointer; }
  .actions a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  code { background: var(--chip); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
</style>
<script src="data/events.js"></script>
</head>
<body>
<main>
  <header>
    <h1>Greater Boston Events</h1>
    <p id="sub"></p>
  </header>
  <div class="controls">
    <div class="row">
      <input type="search" id="q" placeholder="Search title, venue, description…">
      <select id="cat"><option value="">All categories</option></select>
      <select id="when">
        <option value="all">Any day</option>
        <option value="today">Today</option>
        <option value="weekend">This weekend</option>
        <option value="7">Next 7 days</option>
      </select>
    </div>
    <div class="row" id="cities"></div>
  </div>
  <div id="list"></div>
</main>
<script>
(() => {
  const data = window.EVENTS_DATA;
  const $ = (id) => document.getElementById(id);
  if (!data) {
    $('list').innerHTML = '<p class="empty">No data yet. Run the hank to generate <code>app/data/events.js</code>. See README.md.</p>';
    return;
  }

  const TZ = 'America/New_York';
  const today = new Date().toLocaleDateString('en-CA', { timeZone: TZ });
  const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  const events = data.events.filter((e) => e.date >= today);
  const esc = (s = '') => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const fmtDay = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  const fmtTime = (t) => { const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}${m ? ':' + String(m).padStart(2, '0') : ''}${h < 12 ? 'am' : 'pm'}`; };

  $('sub').textContent = `${events.length} upcoming events · updated ${new Date(data.generatedAt).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })}`;

  // Filters
  const state = { q: '', cat: '', when: 'all', city: 'All' };
  for (const c of data.window.categories) $('cat').insertAdjacentHTML('beforeend', `<option>${esc(c)}</option>`);
  const cityCounts = Object.fromEntries(data.window.cities.map((c) => [c, events.filter((e) => e.city === c).length]));
  $('cities').innerHTML = ['All', ...data.window.cities.filter((c) => cityCounts[c])]
    .map((c) => `<button class="chip" data-city="${esc(c)}">${esc(c)}${c === 'All' ? '' : ` ${cityCounts[c]}`}</button>`).join('') + '<span class="count" id="count"></span>';
  $('cities').addEventListener('click', (ev) => { const b = ev.target.closest('[data-city]'); if (b) { state.city = b.dataset.city; render(); } });
  $('q').addEventListener('input', (ev) => { state.q = ev.target.value.toLowerCase(); render(); });
  $('cat').addEventListener('change', (ev) => { state.cat = ev.target.value; render(); });
  $('when').addEventListener('change', (ev) => { state.when = ev.target.value; render(); });

  function inWhen(date) {
    if (state.when === 'all') return true;
    if (state.when === 'today') return date === today;
    if (state.when === '7') return date <= addDays(today, 6);
    // Weekend = the upcoming (or current) Friday–Sunday, never before today.
    const dow = new Date(today + 'T12:00:00').getDay(); // 0 = Sunday
    const sunday = addDays(today, dow === 0 ? 0 : 7 - dow);
    const start = dow === 0 || dow === 6 ? today : addDays(sunday, -2);
    return date >= start && date <= sunday;
  }

  // Calendar links
  const compact = (date, time) => date.replace(/-/g, '') + (time ? 'T' + time.replace(':', '') + '00' : '');
  function endOf(e) {
    if (e.endTime) return { date: e.date, time: e.endTime };
    const [h, m] = e.startTime.split(':').map(Number);
    const mins = h * 60 + m + 120;
    return mins >= 24 * 60 ? { date: e.date, time: '23:59' } : { date: e.date, time: `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}` };
  }
  const location = (e) => [e.venue, e.address, e.city + ', MA'].filter(Boolean).join(', ');
  function googleUrl(e) {
    const dates = e.startTime ? `${compact(e.date, e.startTime)}/${compact(e.date, endOf(e).time)}` : `${compact(e.date)}/${compact(addDays(e.date, 1))}`;
    const p = new URLSearchParams({ action: 'TEMPLATE', text: e.title, dates, ctz: TZ, location: location(e), details: [e.description, e.registerUrl || e.url].filter(Boolean).join('\n\n') });
    return 'https://calendar.google.com/calendar/render?' + p;
  }
  const icsText = (s) => String(s).replace(/\\/g, '\\\\').replace(/[,;]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
  function downloadIcs(e) {
    const when = e.startTime
      ? [`DTSTART;TZID=${TZ}:${compact(e.date, e.startTime)}`, `DTEND;TZID=${TZ}:${compact(e.date, endOf(e).time)}`]
      : [`DTSTART;VALUE=DATE:${compact(e.date)}`, `DTEND;VALUE=DATE:${compact(addDays(e.date, 1))}`];
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//boston-events-hank//EN', 'BEGIN:VEVENT',
      `UID:${e.id || compact(e.date) + Math.random().toString(36).slice(2)}@boston-events-hank`,
      `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '')}`, ...when,
      `SUMMARY:${icsText(e.title)}`, `LOCATION:${icsText(location(e))}`, `URL:${e.registerUrl || e.url}`,
      `DESCRIPTION:${icsText([e.description, e.url].filter(Boolean).join('\n\n'))}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })), download: e.title.replace(/[^\w]+/g, '-').slice(0, 60) + '.ics' });
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function render() {
    document.querySelectorAll('[data-city]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.city === state.city));
    const shown = events.filter((e) =>
      (state.city === 'All' || e.city === state.city) &&
      (!state.cat || e.category === state.cat) &&
      inWhen(e.date) &&
      (!state.q || [e.title, e.venue, e.description, e.source].join(' ').toLowerCase().includes(state.q)));
    $('count').textContent = `${shown.length} shown`;
    if (!shown.length) { $('list').innerHTML = '<p class="empty">No events match these filters.</p>'; return; }

    let html = '', day = '';
    shown.forEach((e) => {
      if (e.date !== day) { day = e.date; html += `<h2>${esc(fmtDay(day))}</h2>`; }
      const time = e.startTime ? fmtTime(e.startTime) + (e.endTime ? '–' + fmtTime(e.endTime) : '') : 'All day / time TBA';
      html += `<article class="event">
        <h3>${esc(e.title)}</h3>
        <div class="meta">${esc(time)} · ${esc(e.venue)}, <b>${esc(e.city)}</b> · ${esc(e.category)}${e.price ? ' · ' + esc(e.price) : ''}</div>
        ${e.description ? `<p>${esc(e.description)}</p>` : ''}
        <div class="actions">
          <a class="primary" href="${esc(e.registerUrl || e.url)}" target="_blank" rel="noopener">${e.registerUrl ? 'Register / tickets' : 'Event page'}</a>
          ${e.registerUrl ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">Details</a>` : ''}
          <a href="${esc(googleUrl(e))}" target="_blank" rel="noopener">+ Google Calendar</a>
          <button data-idx="${events.indexOf(e)}">Download .ics</button>
        </div>
        <div class="meta" style="margin-top:6px;font-size:.78rem">via ${esc(e.source)}</div>
      </article>`;
    });
    $('list').innerHTML = html;
  }
  $('list').addEventListener('click', (ev) => { const b = ev.target.closest('[data-idx]'); if (b) downloadIcs(events[+b.dataset.idx]); });
  render();
})();
</script>
</body>
</html>
